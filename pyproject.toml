[project]
name = "muviseg"
version = "1.0.0"
description = "MuViSeg: multi-view segment correspondences from dense geometry priors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["segment-matching", "multi-view", "correspondences", "mast3r", "vggt"]

dependencies = [
    # Core ML
    # Pinned to the exact versions the reported results were produced with.
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy>=2.0",
    "einops>=0.8",
    # Training loop
    "accelerate>=1.0",
    "tensorboard>=2.17",
    # Config
    "yacs>=0.1.8",
    "pyyaml>=6.0",
    # Vision / geometry
    # <5: OpenCV 5 drops cv2.imshow and ultralytics fails on import.
    "opencv-python>=4.10,<5",
    "pillow>=10.4",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pycocotools>=2.0.8",
    # Backbone fetching (vggt_dpt_lg.py / vggt_lightglue.py fall back to the Hub)
    "huggingface-hub>=0.24",
    # Plots and progress
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# FastSAM ablations, the RoMa baseline, figure scripts and the demo
eval = [
    "ultralytics>=8.2",
    "pandas>=2.2",
    "seaborn>=0.13",
]
# The RoMa dense-matcher baseline. Separate from `eval` because romatch pulls in
# wandb and polars, which nothing else in this project needs.
roma = [
    "romatch>=0.1.2",
]
# ScanNet++ mask generation (scripts/data/generate_masks.py)
dataprep = [
    "sam2>=1.0",
    "hydra-core>=1.3",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://muviseg.github.io"
Repository = "https://github.com/muviseg/muviseg-codeRelease"
Paper = "https://arxiv.org/abs/2607.17938"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muviseg"]

# The reported results were produced with CUDA 12.8 wheels; see docs/installation.md.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["muviseg", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
