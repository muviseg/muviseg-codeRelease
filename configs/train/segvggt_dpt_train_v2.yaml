# SegVGGT-DPT v2 — reduced dataset + grad accum + matchability bias + learnable temperature.
#
# Changes vs v1:
#   - MAX_PAIRS: 1,200,000 (~5 epochs in ~150K optimizer steps)
#   - Gradient accumulation: 2 (effective batch = 40)
#   - MATCHABILITY_BIAS: 0.5 (reduce false dustbin)
#   - TEMPERATURE_INIT: 1.0 (learnable, neutral start)
#
# Usage:
#   accelerate launch -m training.train --config training/config/segvggt_dpt_train_v2.yaml

MODEL:
  ARCH: vggt_dpt
  VGGT_CKPT: third_party/vggt_weights.pt
  VGGT_LAYER_INDICES: [5, 11, 17, 23]
  VGGT_FUSION_DIM: 256
  MATCHABILITY_BIAS: 0.4              # bias matchability logit toward "match" (reduce false dustbin)
  TEMPERATURE_INIT:  1.0              # learnable temperature (1.0 = neutral init)
  LG:
    PROJ_DIM:         128
    N_LAYERS:         3
    N_HEADS:          4
    GRAD_CHECKPOINT:  false
    DEEP_SUPERVISION: false
    LAMBDA_MATCH:     1.0
  LG_V2:
    FFN_EXPANSION:    4

FEATURE_MATCHER:
  TYPE: Sinkhorn
  SINKHORN:
    NUM_IT: 50
    DUSTBIN_SCORE_INIT: 1.0

DATASET:
  METADATA_PATH: /mnt/vol1/datasets/ScanNet++/scannetpp_processed/all_metadata.npz
  DATA_ROOT:     /mnt/vol1/datasets/ScanNet++/scannetpp_processed
  SEGDATA_ROOT:  /mnt/vol1/datasets/ScanNet++/masks_resize_mast3r
  PAIRS_ROOT:    /mnt/vol1/datasets/ScanNet++/masks_resize_mast3r_res
  HEIGHT: 336
  WIDTH:  512
  RESIZE_MODE: square
  VAL_FRACTION: 0.1
  MAX_PAIRS: 1200000                  # ~1.2M pairs → ~30K iters/epoch × 5 = 150K total
  PAIR_DSC_ROOT: ""

TRAINING:
  BATCH_SIZE:      20
  NUM_WORKERS:     8
  PREFETCH_FACTOR: 1
  LR:              0.0001
  WEIGHT_DECAY:    0.0001
  EPOCHS:          5
  GRAD_CLIP:       1.0
  LR_SCHEDULER:    cosine
  WARMUP_STEPS:    500
  LOG_INTERVAL:    100
  VAL_INTERVAL:    5000
  VAL_MAX_BATCHES: 200
  SAVE_INTERVAL:   7000

DEBUG: false
SAVE_DIR: results/segvggt_dpt_v2
RESUME:   null

ACCELERATE:
  MIXED_PRECISION: bf16
  GRADIENT_ACCUMULATION_STEPS: 2
