# SegVGGT-DPT Multiframe — N-frame tuple training with pairwise head.
#
# Key changes vs v3 (pairwise):
#   - ARCH: vggt_dpt_multiframe (N-frame backbone + pairwise attention head)
#   - N_FRAMES: 4 (VGGT processes 4 frames jointly via global attention)
#
# Architecture:
#   VGGT Aggregator (frozen, N frames) → DPT fusion → masked pooling →
#   projection → pairwise attention per pair → DoubleSoftmax scoring
#
# Usage:
#   accelerate launch -m training.train \
#     --config training/config/segvggt_dpt_train_multiframe.yaml

MODEL:
  ARCH: vggt_dpt_multiframe
  VGGT_CKPT: third_party/vggt_weights.pt
  VGGT_LAYER_INDICES: [5, 11, 17, 23]
  VGGT_FUSION_DIM: 256
  MATCHABILITY_BIAS: 0.5
  TEMPERATURE_INIT:  1.0
  LG:
    PROJ_DIM:         128
    N_LAYERS:         3
    N_HEADS:          4
    GRAD_CHECKPOINT:  true
    DEEP_SUPERVISION: false
    LAMBDA_MATCH:     0.3
  LG_V2:
    FFN_EXPANSION:    4

FEATURE_MATCHER:
  TYPE: Sinkhorn
  SINKHORN:
    NUM_IT: 50
    DUSTBIN_SCORE_INIT: 1.0

DATASET:
  METADATA_PATH: ${MUVISEG_DATA_ROOT}/ScanNet++/scannetpp_processed/all_metadata.npz
  DATA_ROOT:     ${MUVISEG_DATA_ROOT}/ScanNet++/scannetpp_processed
  SEGDATA_ROOT:  ${MUVISEG_DATA_ROOT}/ScanNet++/masks_resize_mast3r
  PAIRS_ROOT:    ${MUVISEG_DATA_ROOT}/ScanNet++/masks_resize_mast3r_res
  HEIGHT: 336
  WIDTH:  512
  RESIZE_MODE: square
  VAL_FRACTION: 0.1
  MAX_PAIRS: 1200000
  PAIR_DSC_ROOT: ""
  N_FRAMES: 4
  MIN_PAIRS_PER_TUPLE: 2
  MAX_PAIRS_PER_TUPLE: 6
  RANDOM_NEIGHBOR_PROB: 0.2

TRAINING:
  BATCH_SIZE:      32
  NUM_WORKERS:     6
  PREFETCH_FACTOR: 1
  LR:              0.0001
  WEIGHT_DECAY:    0.0001
  EPOCHS:          5
  GRAD_CLIP:       1.0
  LR_SCHEDULER:    cosine
  WARMUP_STEPS:    500
  LOG_INTERVAL:    100
  VAL_INTERVAL:    2000
  VAL_MAX_BATCHES: 200
  SAVE_INTERVAL:   5000

DEBUG: false
SAVE_DIR: results/segvggt_dpt/multiframe-002
RESUME:   null

ACCELERATE:
  MIXED_PRECISION: bf16
  GRADIENT_ACCUMULATION_STEPS: 8
