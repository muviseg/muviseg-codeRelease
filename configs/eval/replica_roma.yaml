DATASET:
  DATA_ROOT: ${MUVISEG_DATA_ROOT}/Replica
  DATA_SOURCE: Replica
  SCENES: ['office_0', 'office_1', 'office_2', 'office_3', 'office_4',
           'room_0', 'room_1', 'room_2']
  SEQUENCE: Sequence_1
  HEIGHT: 336
  WIDTH: 512
  RESIZE_H: 336
  RESIZE_W: 512
  M_PRIME: 50
  INSTANCE_MASK_ROOT: ${MUVISEG_DATA_ROOT}/Replica/Replica_Instance_Segmentation
EVAL:
  PAIRS_FILE: assets/pairs/pairs_replica.json
  POSE_BINS: [[0, 45], [45, 90], [90, 135], [135, 180]]
  BATCH_SIZE: 1
  NUM_WORKERS: 4
  N_FRAMES: 4
  CONTEXT_STEP: 5
  OUTPUT_DIR: results/roma_replica/certainty

MODEL:
  ARCH: roma
  ROMA_VARIANT: indoor
  ROMA_SCORING: certainty   # 'votes' is the sparse alternative; see core/roma_infer.py
  ROMA_NUM_SAMPLES: 5000
  ROMA_UPSAMPLE: false
  VGGT_CKPT: third_party/vggt_weights.pt
  LAYER_INDICES: [5, 11, 17, 23]
  FUSION_DIM: 256
  PROJ_DIM: 128
  N_JOINT_LAYERS: 3
  MAX_FRAMES: 16
  N_HEADS: 4
  FFN_EXPANSION: 4
  MATCHABILITY_BIAS: 0.5
  TEMPERATURE_INIT: 0.85

RANDOM_SEED: 42
DEBUG: false
