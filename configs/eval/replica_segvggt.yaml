  HEIGHT: 336
  WIDTH: 512
  RESIZE_H: 336
  RESIZE_W: 512
  M_PRIME: 50
  INSTANCE_MASK_ROOT: ${MUVISEG_DATA_ROOT}/Replica/Replica_Instance_Segmentation
