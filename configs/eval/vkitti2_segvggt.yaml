DATASET:
  DATA_ROOT: ${MUVISEG_DATA_ROOT}/VirtualKITTI2
  DATA_SOURCE: VKITTI2
  SCENES: ['Scene01', 'Scene02', 'Scene06', 'Scene18', 'Scene20']
  VARIANTS: ['clone', '15-deg-left', '30-deg-right', 'sunset']
  HEIGHT: 336
  WIDTH: 512
  RESIZE_H: 336
  RESIZE_W: 512
  M_PRIME: 50

EVAL:
  PAIRS_FILE: assets/pairs/pairs_vkitti2.json
  POSE_BINS: [[0, 20], [20, 40], [40, 60], [60, 90]]
  BATCH_SIZE: 1
  NUM_WORKERS: 4
  OUTPUT_DIR: results/segvggt_dpt_vkitti2/v3-001

MODEL:
  ARCH: segvggt_dpt
  CHECKPOINT: results/segvggt_dpt/v3-001/best.pth
  VGGT_CKPT: third_party/vggt_weights.pt
  LAYER_INDICES: [5, 11, 17, 23]
  FUSION_DIM: 256
  PROJ_DIM: 128
  N_LAYERS: 3
  N_HEADS: 4
  FFN_EXPANSION: 4
  MATCHABILITY_BIAS: 0.5
  TEMPERATURE_INIT: 1.0

RANDOM_SEED: 42
DEBUG: false
