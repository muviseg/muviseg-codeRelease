DATASET:
  DATA_ROOT: /mnt/vol0/home/dennis/nabo-dataset-mounted/virtual-KITTI-2
  DATA_SOURCE: VKITTI2
  SCENES: ['Scene01', 'Scene02', 'Scene06', 'Scene18', 'Scene20']
  VARIANTS: ['clone', '15-deg-left', '30-deg-right', 'sunset']
  HEIGHT: 336
  WIDTH: 512
  RESIZE_H: 336
  RESIZE_W: 512
  M_PRIME: 50  # Max number of masks to keep per image

EVAL:
  PAIRS_FILE: pairs_vkitti2_4000.json  # was pairs_vkitti2_3200.json, which is byte-identical to the Replica pairs file (md5 ee66193a) and
  # therefore evaluated Replica pair indices against VKITTI2 data
  POSE_BINS: [[0, 20], [20, 40], [40, 60], [60, 90]]  # Optimized for driving dataset
  BATCH_SIZE: 1
  NUM_WORKERS: 4
  TEMPORAL_GAP_MIN: 6
  TEMPORAL_GAP_MAX: 42
  NUM_PAIRS_PER_VARIANT: 160
  OUTPUT_DIR: results/vkitti2_fastsam_trackid_gt

MODEL:
  CHECKPOINT: checkpoints/segmast3r_spp.ckpt
  TYPE: MASt3RSegFeat

FEATURE_MATCHER:
  TYPE: Sinkhorn
  SINKHORN:
    DUSTBIN_SCORE_INIT: 5.3937
    NUM_IT: 50

RANDOM_SEED: 42
DEBUG: false
